name: Semantic Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Required. @semantic-release/npm requests a GitHub OIDC token and exchanges it with npm for a
      # short-lived publish credential; without this the exchange fails and there is no token to fall
      # back on, because the package disallows them.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Prepare package workspace
        run: mkdir -p package

      - name: Build package artifacts
        run: ./package.sh

      # No npm token: the package is configured for Trusted Publishing with tokens disallowed, so
      # auth is the OIDC exchange alone. Setting NPM_TOKEN here would write a conflicting .npmrc.
      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm semantic-release
